version: '3.8'

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

services:
  # Router API - FastAPI 入口 (app.main:app)
  router-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.router
    container_name: llm-router-api
    ports:
      - "9000:8000"
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/conversations.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_BASE_URL=${GEMINI_BASE_URL}
      - GEMINI_SDK_URL=${GEMINI_SDK_URL:-}
      - DEFAULT_LLM_MODEL=${DEFAULT_LLM_MODEL:-gemini-3-flash-preview}
      - GEMINI_IMAGE_MODEL=${GEMINI_IMAGE_MODEL:-gemini-3-pro-image-preview}
      - GRAFANA_URL=http://47.89.135.221:9001/
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
      # 渲染整个 Dashboard
      - GRAFANA_RENDER_PATH=render/d/llm-router-dashboard/dashboard?orgId=1&width=1200&height=800&kiosk
      - REPORT_TIMEZONE=Asia/Shanghai
    depends_on:
      - grafana
    networks:
      - default
      - edge-shared
    logging: *default-logging
    restart: unless-stopped

  # Caddy - public HTTPS entrypoint for api.meowuisland.com
  caddy:
    image: caddy:2-alpine
    container_name: llm-router-caddy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - router-api
    networks:
      - edge-shared
    logging: *default-logging
    restart: unless-stopped

  # Metrics Exporter - 扫描日志并暴露Prometheus指标
  metrics-exporter:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: llm-metrics-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./output:/app/output:ro
      - ./data:/app/data
    environment:
      - SCAN_INTERVAL=30
      - CCU_WINDOW=300
      - PRICE_PROMPT=0.50
      - PRICE_COMPLETION=3.00
      - PRICE_CACHED=0.05
    logging: *default-logging
    restart: unless-stopped

  # Prometheus - 时序数据库
  prometheus:
    image: prom/prometheus:latest
    container_name: llm-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    logging: *default-logging
    restart: unless-stopped

  # Grafana Image Renderer - 独立渲染服务
  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: llm-grafana-renderer
    ports:
      - "9002:8081"
    environment:
      - ENABLE_METRICS=true
      - RENDERING_MODE=default
      - RENDERING_CLUSTERING_MODE=browser
    logging: *default-logging
    restart: unless-stopped

  # Grafana - 可视化面板
  grafana:
    image: grafana/grafana:latest
    container_name: llm-grafana
    ports:
      - "9001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
      # Image Renderer 配置
      - GF_RENDERING_SERVER_URL=http://renderer:8081/render
      - GF_RENDERING_CALLBACK_URL=http://grafana:3000/
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data:/var/lib/grafana/sqlite:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - renderer
    logging: *default-logging
    restart: unless-stopped

  # Grafana Report Sender - 定时发送报表
  grafana-report:
    build:
      context: .
      dockerfile: Dockerfile.report
    container_name: llm-grafana-report
    environment:
      - FEISHU_BOT_API_KEY=${FEISHU_BOT_API_KEY}
      - FEISHU_BOT_API_SECRET=${FEISHU_BOT_API_SECRET}
      - FEISHU_CHAT_ID=${FEISHU_CHAT_ID}
      - FEISHU_RECEIVE_ID_TYPE=chat_id
      - GRAFANA_URL=http://20.198.242.101:9001/
      - GRAFANA_TOKEN=${GRAFANA_TOKEN}
      # 渲染整个 Dashboard
      - GRAFANA_RENDER_PATH=render/d/llm-router-dashboard/dashboard?orgId=1&width=1200&height=800&kiosk
      - REPORT_TIMEZONE=Asia/Shanghai
    volumes:
      - ./output:/app/output
    depends_on:
      - grafana
    logging: *default-logging
    restart: unless-stopped

  # Developer Admin - 开发者管理界面
  developer-admin:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: llm-developer-admin
    ports:
      - "9095:9095"
    volumes:
      - ./data:/app/data
      - ./output:/app/output:ro
    environment:
      - ADMIN_PORT=9095
      - DB_PATH=/app/data/conversations.db
      - OUTPUT_DIR=/app/output
    command: [ "python", "-u", "developer_admin.py" ]
    logging: *default-logging
    restart: unless-stopped

  # Gameplay Telemetry Importer - 导入 gameplay JSON 到 SQLite
  gameplay-importer:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: llm-gameplay-importer
    volumes:
      - ./data:/app/data
      - ./output:/app/output:ro
    environment:
      - DB_PATH=/app/data/conversations.db
      - GAMEPLAY_TELEMETRY_DIR=/app/data/gameplay_telemetry
      - OUTPUT_DIR=/app/output
      - GAMEPLAY_IMPORTER_STATE_PATH=/app/data/gameplay_importer_state.json
      - GAMEPLAY_IMPORT_INTERVAL_SEC=300
    command: [ "python", "-u", "import_gameplay_telemetry.py", "--loop" ]
    logging: *default-logging
    restart: unless-stopped

  # Output Retention - 归档并清理 30 天前的原始 router 输出
  output-retention:
    build:
      context: .
      dockerfile: Dockerfile.metrics
    container_name: llm-output-retention
    volumes:
      - ./data:/app/data
      - ./output:/app/output
    environment:
      - OUTPUT_DIR=/app/output
      - OUTPUT_ARCHIVE_DIR=/app/data/output_archive
      - OUTPUT_RETENTION_DAYS=30
      - OUTPUT_ARCHIVE_RETENTION_DAYS=90
      - OUTPUT_ARCHIVE_MAX_BYTES=20G
      - OUTPUT_MAX_BYTES=20G
      - OUTPUT_MIN_FREE_BYTES=10G
      - OUTPUT_RETENTION_INTERVAL_SEC=3600
    command: [ "python", "-u", "cleanup_output_retention.py", "--loop" ]
    logging: *default-logging
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:

networks:
  edge-shared:
    external: true
