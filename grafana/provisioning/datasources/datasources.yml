apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: SQLite
    type: frser-sqlite-datasource
    access: proxy
    jsonData:
      path: /var/lib/grafana/sqlite/conversations.db
    editable: true
