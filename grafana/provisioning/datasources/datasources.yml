apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: SQLite
    type: frser-sqlite-datasource
    access: proxy
    jsonData:
      path: /var/lib/grafana/sqlite/conversations.db
      # Allow short importer transactions to finish before rejecting dashboard reads.
      pathOptions: "_pragma=busy_timeout(10000)"
    editable: true
